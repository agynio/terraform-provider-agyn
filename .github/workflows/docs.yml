name: Docs
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: hashicorp/setup-terraform@v3
      - name: Generate protobufs
        run: |
          buf dep update
          buf generate
      - name: Generate docs
        run: make generate
      - name: Check docs drift
        run: git diff --exit-code docs/
      - name: Validate docs
        run: |
          cd tools
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs validate --provider-dir .. -provider-name agyn
