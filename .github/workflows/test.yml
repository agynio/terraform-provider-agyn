name: Tests
on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    paths-ignore:
      - 'README.md'
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4.1.1
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Generate protobufs
        run: |
          buf dep update
          buf generate
      - name: Get dependencies
        run: go mod download
      - name: Build
        run: go build -v .
  test:
    name: Unit Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4.1.1
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Generate protobufs
        run: |
          buf dep update
          buf generate
      - name: Get dependencies
        run: go mod download
      - name: Unit tests
        timeout-minutes: 10
        run: go test -v -cover ./...
